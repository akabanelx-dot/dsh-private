# dsh-auto-approve bundle patch: 把该插件行插入 web profile 花名册。
# 作为 profile bundle 层（dsh.bundle.patch 清单字段）叠加在 dsh-base 之上；
# 建议把本包放在 dsh.profile.bundles 中 @deepseek-ai/dsh-web-app 之前，
# 这样它的自动批准应答者会在 apiproxy（人工应答者）之前注册。
#
# 该行是「按包名裸插件」：node 半边（exports "."）在宿主进程运行
# （approval/request 应答者 + 会话策略接管 + /api/dsh-auto-approve 路由 + 审计存储），
# 而 package.json 里的 dsh.client 声明让浏览器半边（exports "./client"，
# 以 /plugins/<id>/client.js 提供）在 Web GUI 中加载。
- insert:
    - id: auto-approve
      name: dsh-auto-approve
